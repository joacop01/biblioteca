name: Publicar la biblioteca

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Looks up any new Goodreads rows on Open Library (covers, colors, years).
      - name: Importar Goodreads
        run: npm run import

      - name: Guardar lo importado
        run: |
          if [ -n "$(git status --porcelain -- data src/data public)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data src/data public
            git commit -m "Actualizar la biblioteca desde Goodreads"
            git push
          fi

      - run: npm run build

      # GitHub Pages serves the gh-pages branch.
      - name: Publicar en gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
